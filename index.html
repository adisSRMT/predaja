<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2538">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Predaja vozil</title>
<style>
:root{color-scheme:light dark;--bg:#eef1f4;--cd:#fff;--tx:#0d1b2a;--mu:#5b6b7b;--ln:#d9e0e7;--nv:#0d2538;--yl:#ffd400;--ok:#1f9d55;--wa:#d9780a;--bd:#d92d20;--in:#f4f6f8}
@media(prefers-color-scheme:dark){:root{--bg:#0a1119;--cd:#131e2a;--tx:#e8eef4;--mu:#8fa1b3;--ln:#263545;--nv:#08141f;--in:#0d1721}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--nv);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 20px 16px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.plate{display:inline-block;padding:6px 10px;border-radius:6px;background:var(--yl);color:#0d2538;font:800 15px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em}
h1{margin:10px 0;font-size:24px;letter-spacing:-.01em}
.pg{display:flex;gap:4px}.pg i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}.pg i.on{background:var(--yl)}
main{max-width:640px;margin:0 auto;padding:14px 14px 110px}
.gt{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px;font-size:13px;font-weight:700;color:var(--mu);letter-spacing:.04em;text-transform:uppercase}
.gt:first-child{margin-top:4px}
.ao{border:0;background:none;color:var(--ok);font:700 14px inherit;padding:8px 0;text-transform:none;letter-spacing:0}
.cd,.it{background:var(--cd);border:1.5px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.it.err{border-color:var(--bd)}
.nm{margin-bottom:10px;font-weight:600}
.tg{display:flex;gap:8px}
.tg button{flex:1;min-height:50px;padding:0 4px;border:2px solid var(--ln);border-radius:10px;background:var(--in);color:var(--tx);font:600 15px inherit}
.tg .on{color:#fff;border-color:transparent}
.tg .ok.on{background:var(--ok)}.tg .wa.on{background:var(--wa)}.tg .bad.on{background:var(--bd)}
.fl{display:block;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--mu)}
.fl:last-child{margin-bottom:0}
input,select,textarea{display:block;width:100%;min-height:50px;margin-top:5px;padding:12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--in);color:var(--tx);font:16px inherit}
textarea{min-height:80px;margin-top:0}
.err{border-color:var(--bd)!important}
:focus-visible{outline:3px solid var(--yl);outline-offset:1px}
.dt{margin-top:12px;padding-top:12px;border-top:1px dashed var(--ln)}
.ph{display:inline-block;margin-top:10px;padding:12px 14px;border:1.5px dashed var(--mu);border-radius:10px;font-size:14px;font-weight:600}
.pv{display:block;width:72px;height:72px;margin-top:10px;border-radius:8px;object-fit:cover}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck{display:flex;gap:12px;align-items:center;margin-top:10px;font-weight:600}
.ck input{width:26px;height:26px;min-height:0;margin:0}
.ban{margin-bottom:12px;padding:12px 14px;border-radius:12px;background:var(--cd);border:1.5px solid var(--ln);font-size:14px}
.ban.w{border-color:var(--bd)}.ban b{display:block}
canvas{width:100%;height:150px;margin-top:5px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;touch-action:none}
.cl{border:0;background:none;color:var(--mu);font:600 14px inherit;padding:8px 0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--cd);border-top:1px solid var(--ln)}
.b{flex:1;min-height:54px;border:0;border-radius:12px;font:700 17px inherit}
.b.pr{flex:2;background:var(--yl);color:#0d2538}.b.gh{background:var(--in);color:var(--tx)}
.lgc{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 20px}
.lgc h1{margin:16px 0 20px;font-size:28px}
.done{padding:80px 24px;text-align:center}
.dc{width:84px;height:84px;margin:0 auto 20px;border-radius:50%;background:var(--ok);color:#fff;font-size:44px;line-height:84px}
.mu{color:var(--mu)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));padding:14px;border-radius:12px;background:#0d2538;color:#fff;font-weight:600;text-align:center;display:none;z-index:9}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="lg" hidden></div>
<header id="hd" hidden><div class="top"><b class="plate" id="bv"></b><span id="us"></span></div><h1 id="ti"></h1><div class="pg" id="pg"></div></header>
<main id="mn"></main>
<nav class="nav" id="nv" hidden><button class="b gh" id="bk" type="button">Nazaj</button><button class="b pr" id="nx" type="button">Naprej</button></nav>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script>
const C=CONFIG,$=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BAD=['Napaka','Manjka','Pokvarjeno','Ni opravljeno','So poškodbe','Ni OK'],GOOD=['OK','Opravljeno','Ni poškodb'];
const cl=s=>BAD.includes(s)?'bad':GOOD.includes(s)?'ok':'wa';
const T1=['OK','Dolij'],T2=['OK','Napaka'],T3=['OK','Opravljeno','Ni opravljeno'],T4=['OK','Manjka','Pokvarjeno'],T5=['OK','Manjka'];
const tk=new URLSearchParams(location.search).get('v');let V=C.vozila.find(v=>v.zeton===tk),U,lastKm=0,cur=0,S=[];
const toast=t=>{const m=$('#toast');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',3500)};
const Q=()=>{try{return JSON.parse(localStorage.q||'[]')}catch(e){return[]}};

const it=(sk,n,st,pf)=>`<div class=it data-sk="${E(sk)}" data-n="${E(n)}"${pf?' data-pf=1':''}><div class=nm>${E(n)}</div><div class=tg>${st.map(s=>`<button type=button class=${cl(s)} data-s="${E(s)}">${E(s)}</button>`).join('')}</div><div class=dt hidden><textarea placeholder="Opiši težavo …"></textarea><label class=ph>Dodaj fotografijo<input type=file accept="image/*" capture=environment hidden></label><img class=pv hidden alt=""></div></div>`;
const grp=(t,a,st,ok)=>`<section class=g><div class=gt><span>${E(t)}</span>${ok?'<button type=button class=ao>Vse OK</button>':''}</div>${a.map(n=>it(t,n,st)).join('')}</section>`;
const sel=(id,l,a,v)=>`<label class=fl>${l}<select id=${id}><option value="">Izberi …</option>${a.map(x=>`<option${x===v?' selected':''}>${E(x)}</option>`).join('')}</select></label>`;
const seg=(id,l,a)=>`<div class=fl>${l}</div><div class=tg id=${id} data-req>${a.map(x=>`<button type=button class=ok data-s="${E(x)}">${E(x)}</button>`).join('')}</div>`;
const num=(sk,n,ph,o)=>`<label class=fl>${E(n)}<input type=number inputmode=decimal data-sk="${E(sk)}" data-n="${E(n)}" placeholder="${ph}"${o?' data-o=1':''}></label>`;
const sg=(id,l)=>`<label class=fl>${l}<canvas id=${id} width=600 height=300></canvas></label><button class=cl type=button data-c=${id}>Počisti podpis</button>`;

function build(){
  const names=C.zaposleni.map(z=>z.ime),now=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
  S=[
  ['Osnovno',`<div id=li></div><div class=cd>${sel('od','Oddajnik',names,U)}${sel('pr','Prevzemnik',names)}${seg('iz','Izmena',C.izmene)}<label class=fl style="margin-top:14px">Datum in ura predaje<input id=ct type=datetime-local value="${now}"></label></div>`],
  ['Vozilo',`<div class=cd><label class=fl>Kilometrina (km)<input id=km type=number inputmode=numeric min=0></label>${seg('go','Gorivo',['¼','½','¾','Polno'])}</div>
   <section class=g><div class=gt><span>Tekočine</span><button type=button class=ao>Vse OK</button></div>${['Olje','AdBlue','Tekočina za brisalce'].map(n=>it('Vozilo',n,T1)).join('')}</section>
   <section class=g><div class=gt><span>Delovanje</span><button type=button class=ao>Vse OK</button></div>${['Gume','Luči','Modre luči','Sirena'].map(n=>it('Vozilo',n,T2)).join('')}</section>
   <div class=gt><span>Stanje</span></div>${it('Vozilo','Poškodbe karoserije',['Ni poškodb','So poškodbe'],1)}${it('Vozilo','Čistoča in razkuževanje',T3)}`],
  ['Kisik',`<div class=cd>${num('Kisik','KISIK 1 (bar)','bar')}${num('Kisik','KISIK 2 (bar)','bar')}${num('Kisik','Prenosna jeklenka (bar) ','bar',1)}</div>`],
  ['Zdravila',`<div class=gt><span>Po seznamu vozila</span></div>${C.zdravila.map(m=>`<div class="it md" data-n="${E(m.ime)}"><div class=nm>${E(m.ime)}</div><div class=r2><label class=fl>Količina (cilj ${m.kol})<input type=number inputmode=numeric min=0></label><label class=fl>Rok uporabe<input type=month></label></div></div>`).join('')}
   <div class=gt><span>Opioidi / narkotiki</span></div><div class=cd>${C.opioidi.map(m=>num('Opioidi',m.ime+' – preštetih (cilj '+m.kol+')','število')).join('')}<label class=ck><input type=checkbox id=c1>Oddajnik potrjuje štetje</label><label class=ck><input type=checkbox id=c2>Prevzemnik potrjuje štetje</label></div>`],
  ['Oprema',`<div class=gt><span>${E(C.defibrilator)}</span></div><div class=cd>${num('Oprema','Defibrilator – baterija (%)','%')}</div>${it('Oprema','Defibrilator – samotest',['OK','Ni OK'])}`+Object.entries(C.oprema).map(([g,a])=>grp(g,a,T4,1)).join('')],
  ['Posebnosti',`${['Ključi','Dokumenti','Kartica za gorivo'].map(n=>it('Posebnosti',n,T5)).join('')}<div class=gt><span>Opombe</span></div><textarea id=op placeholder="Neobvezno" style="border:1.5px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--tx);padding:12px;font:16px inherit"></textarea>`],
  ['Potrditev',`<div class=ban id=sm></div><div class=cd>${sg('s1','Podpis oddajnika')}</div><div class=cd>${sg('s2','Podpis prevzemnika')}</div>`]
  ];
  $('#mn').innerHTML=S.map(s=>`<div class=st hidden>${s[1]}</div>`).join('');
  $('#pg').innerHTML=S.map(()=>'<i></i>').join('');
  $('#od').value=U;$$('canvas').forEach(pad);
}

function pad(c){
  const x=c.getContext('2d');x.lineWidth=4;x.lineCap='round';x.strokeStyle='#0d2538';let d=0;
  const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
  c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke();c.dataset.f=1;c.classList.remove('err')}};
  c.onpointerup=()=>d=0;
}
const shrink=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};i.src=URL.createObjectURL(f)});

function pick(x,b){$$('.tg button',x).forEach(y=>y.classList.remove('on'));b.classList.add('on');x.dataset.s=b.dataset.s;x.classList.remove('err');const d=$('.dt',x);if(d)d.hidden=!BAD.includes(b.dataset.s)}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.c){const c=$('#'+b.dataset.c);c.getContext('2d').clearRect(0,0,c.width,c.height);delete c.dataset.f}
  else if(b.classList.contains('ao'))$$('.it',b.closest('.g')).forEach(x=>pick(x,$('.tg button',x)));
  else if(b.closest('.tg')){const t=b.closest('.tg'),x=t.closest('.it');if(x)pick(x,b);else{$$('button',t).forEach(y=>y.classList.remove('on'));b.classList.add('on');t.classList.remove('err')}}
});
document.addEventListener('change',async e=>{
  const i=e.target;if(i.type!=='file'||!i.files[0])return;
  const x=i.closest('.it');x._f=await shrink(i.files[0]);const p=$('.pv',x);p.src=x._f;p.hidden=false;$('.ph',x).classList.remove('err');
});

function chk(n){
  const s=$$('.st')[n];let bad=null,m='Dopolni označena polja.';const mk=x=>{x.classList.add('err');bad=bad||x};
  $$('.it',s).forEach(x=>{
    if(x.classList.contains('md')){$$('input',x).forEach(i=>{if(!i.value)mk(x)});return}
    const v=x.dataset.s;if(!v)return mk(x);
    if(BAD.includes(v)){const t=$('textarea',x);if(!t.value.trim())mk(t);if((x.dataset.pf||C.FOTO_OBVEZNA)&&!x._f)mk($('.ph',x))}
  });
  $$('input:not([type=file]):not([type=checkbox]):not([data-o]),select',s).forEach(i=>{if(!i.closest('.md')&&i.value==='')mk(i)});
  $$('.tg[data-req]',s).forEach(t=>{if(!$('.on',t))mk(t)});
  if(n===0&&$('#od').value&&$('#od').value===$('#pr').value){mk($('#pr'));m='Oddajnik in prevzemnik ne smeta biti ista oseba.'}
  if(n===1&&$('#km').value&&+$('#km').value<lastKm){mk($('#km'));m=`Kilometri ne smejo biti manjši od zadnje predaje (${lastKm}).`}
  if(n===3&&!($('#c1').checked&&$('#c2').checked)){mk($('#c1').closest('.cd'));m='Štetje opioidov morata potrditi oba.'}
  if(n===6)$$('canvas',s).forEach(c=>{if(!c.dataset.f)mk(c)});
  if(bad){bad.scrollIntoView({block:'center'});toast(m);return false}
  return true;
}
function sum(){
  const b=collect().postavke.filter(x=>x.slaba);
  $('#sm').className='ban'+(b.length?' w':'');
  $('#sm').innerHTML=b.length?`<b>${b.length} odstopanj (vodja bo obveščen)</b>${b.map(x=>E(x.ime)+': '+E(x.stanje)).join('<br>')}`:'<b>Vse v redu</b>Ni odstopanj.';
}
function go(n){
  cur=n;$$('.st').forEach((s,i)=>s.hidden=i!==n);$('#ti').textContent=`${n+1}/${S.length} · ${S[n][0]}`;
  $$('#pg i').forEach((p,i)=>p.className=i<=n?'on':'');$('#bk').style.visibility=n?'visible':'hidden';
  $('#nx').textContent=n===S.length-1?'Pošlji predajo':'Naprej';if(n===S.length-1)sum();scrollTo(0,0);
}
function collect(){
  const P=[],g=n=>{const t=$('#'+n+' .on');return t?t.dataset.s:''};
  $$('.it:not(.md)').forEach(x=>P.push({sk:x.dataset.sk,ime:x.dataset.n,stanje:x.dataset.s||'',slaba:BAD.includes(x.dataset.s),komentar:$('textarea',x).value.trim(),foto:x._f||''}));
  $$('.md').forEach(m=>{const[q,d]=$$('input',m);P.push({sk:'Zdravila',ime:m.dataset.n,stanje:'',vrednost:q.value,rok:d.value})});
  $$('input[data-n]').forEach(i=>P.push({sk:i.dataset.sk,ime:i.dataset.n,stanje:'',vrednost:i.value}));
  P.push({sk:'Opombe',ime:'Opombe',stanje:'',komentar:$('#op').value.trim()});
  return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),k:C.KLJUC,vozilo:V.oznaka,oddajnik:$('#od').value,prevzemnik:$('#pr').value,izmena:g('iz'),cas:$('#ct').value,km:+$('#km').value,gorivo:g('go'),postavke:P,podpisO:$('#s1').toDataURL('image/png'),podpisP:$('#s2').toDataURL('image/png')};
}
async function flush(){
  if(!C.SHEET_URL)return;const a=Q();
  while(a.length){try{await fetch(C.SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(a[0])});a.shift();localStorage.q=JSON.stringify(a)}catch(e){break}}
}
async function send(){
  const o=collect(),a=Q();a.push(o);
  try{localStorage.q=JSON.stringify(a)}catch(e){return toast('Ni dovolj pomnilnika. Poveži se z internetom in poskusi znova.')}
  await flush();const w=Q().length,n=o.postavke.filter(x=>x.slaba).length;
  $('#hd').hidden=$('#nv').hidden=true;
  $('#mn').innerHTML=`<div class=done><div class=dc>✓</div><h1>Predaja zabeležena</h1><p>${E(o.vozilo)}: ${E(o.oddajnik)} → ${E(o.prevzemnik)}</p><p class=mu>${n?n+' odstopanj javljenih vodji. ':''}${C.SHEET_URL?(w?'Ni povezave. Pošlje se samodejno, ko bo na voljo.':'Poslano.'):'Shranjeno samo v tem telefonu.'}</p><button class="b pr" style="margin-top:24px;padding:0 28px" onclick=location.reload()>Nova predaja</button></div>`;
}
async function info(){
  if(!C.SHEET_URL)return;
  try{
    const r=await(await fetch(`${C.SHEET_URL}?v=${encodeURIComponent(V.oznaka)}&k=${encodeURIComponent(C.KLJUC)}`)).json();
    if(r.km)lastKm=+r.km;
    $('#li').innerHTML=(r.km?`<div class=ban><b>Zadnja predaja</b>${E(r.cas)} · prevzel ${E(r.prevzel)} · ${E(r.km)} km</div>`:'')+(r.napake&&r.napake.length?`<div class="ban w"><b>Odprte napake (${r.napake.length})</b>${r.napake.map(x=>E(x.p)+': '+E(x.o)).join('<br>')}</div>`:'');
    $('#km').min=lastKm;
  }catch(e){}
}
function start(){
  $('#lg').hidden=true;$('#hd').hidden=$('#nv').hidden=false;$('#bv').textContent=V.oznaka;$('#us').textContent=U;
  build();go(0);info();
  $('#bk').onclick=()=>go(cur-1);
  $('#nx').onclick=()=>{if(chk(cur))cur===S.length-1?send():go(cur+1)};
}
function login(){
  const L=$('#lg');L.hidden=false;
  L.innerHTML=`<div class=lgc><span class=plate>${V?E(V.oznaka):'QR koda ni prepoznana'}</span><h1>Predaja vozila</h1>${V?'':`<p class=mu>Skeniraj QR kodo na vozilu ali vozilo izberi ročno.</p>${sel('lv','Vozilo',C.vozila.map(v=>v.oznaka))}`}${sel('lu','Uporabnik',C.zaposleni.map(z=>z.ime))}<label class=fl>PIN<input id=lp type=password inputmode=numeric autocomplete=off></label><button class="b pr" id=lb style="width:100%;margin-top:8px">Prijava</button></div>`;
  $('#lb').onclick=()=>{
    const u=C.zaposleni.find(z=>z.ime===$('#lu').value);
    if(!V&&$('#lv'))V=C.vozila.find(v=>v.oznaka===$('#lv').value);
    if(!V||!u||u.pin!==$('#lp').value)return toast('Napačen PIN ali manjka vozilo.');
    U=u.ime;sessionStorage.u=U;start();
  };
}
addEventListener('online',flush);flush();
if(sessionStorage.u&&V){U=sessionStorage.u;start()}else login();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
